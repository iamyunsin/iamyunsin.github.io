# deploy-mysite.yml
name: Deploy to Tencent Cloud COS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository using git
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.7.0
      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 9.14.4
          run_install: true
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build:mysite
      - name: Deploy to Tencent Cloud COS
        if: ${{ secrets.TENCENT_CLOUD_SECRET_ID != '' && secrets.TENCENT_CLOUD_SECRET_KEY != '' }}
        env:
          SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          pip install coscmd
          coscmd config -a "$SECRET_ID" -s "$SECRET_KEY" -b yunsin-top-1251451201 -r ap-chengdu
          coscmd upload -rs --delete ./dist/ /

