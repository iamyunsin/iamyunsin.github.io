# deploy-mysite.yml
name: Deploy to Tencent Cloud COS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository using git
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.7.0
      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 9.14.4
      - name: Install dependencies
        run: pnpm install
      - name: Build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.PUBLIC_BAIDU_SITE_VERIFICATION }}
        run: pnpm run build:mysite
      - name: Deploy to Tencent Cloud COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          pip install cos-python-sdk-v5
          python3 scripts/deploy-cos.py
      - name: Push Sitemap URLs to Search Engines (IndexNow & Baidu API)
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: pnpm run seo:push

